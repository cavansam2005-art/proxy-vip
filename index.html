<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENS VIP – Kích hoạt & Cấu hình</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#3DF2C8; --yellow:#FFE14D; --magenta:#FF2BD6; --ink:#1A0B2E;
    --extrude:#4B1F7A; --track-off:#7B4FD6; --muted:#B9A6E0; --danger:#FF6B8B;
    --bg: #09090e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; min-height:100dvh; background: var(--bg); color:#fff;
    font-family:"Baloo 2", system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow-x:hidden; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
    background-image: radial-gradient(circle at 50% 0%, #1e1338 0%, #09090e 60%);
  }
  
  /* Ẩn/Hiện các trang */
  .page { display: none; width: 100%; max-width: 400px; flex-direction: column; gap: 15px; animation: fadeIn 0.3s ease; }
  .page.active { display: flex; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }

  /* TRANG 1: LOGIN */
  .login-card {
    background: rgba(26, 11, 46, 0.8); border: 1.5px solid var(--magenta);
    border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align: center;
  }
  .login-title { font-size: 24px; font-weight: 800; text-transform: uppercase; background: linear-gradient(90deg, var(--cyan), var(--magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
  .input-group { margin-top: 20px; text-align: left; }
  .input-group label { font-size: 12px; color: var(--cyan); font-weight: bold; margin-bottom: 5px; display: block; }
  .input-group input {
    width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 16px; font-family: monospace;
    outline: none; transition: 0.2s; text-transform: uppercase;
  }
  .input-group input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(61,242,200,0.3); }
  .btn-main {
    width: 100%; padding: 16px; margin-top: 25px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, var(--magenta), #b14cff); color: #fff;
    font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 43, 214, 0.4);
  }
  .btn-main:active { transform: scale(0.97); }

  /* TRANG 2: DASHBOARD ĐỘ NHẠY */
  .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .user-info { font-size: 13px; color: var(--muted); }
  .user-info b { color: var(--cyan); font-size: 15px; }
  .timer { background: rgba(255, 43, 214, 0.15); border: 1px solid var(--magenta); color: var(--magenta); padding: 5px 12px; border-radius: 20px; font-family: monospace; font-weight: bold; font-size: 14px; }

  .sens-container { background: #12121c; border: 1px solid #2a2a3e; border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
  .sens-row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #2a2a3e; }
  .sens-row:last-child { border-bottom: none; padding-bottom: 0; }
  .sens-name { font-size: 14px; font-weight: 600; color: #ccc; }
  .sens-ctrl { display: flex; align-items: center; gap: 10px; }
  .btn-ctrl { width: 32px; height: 32px; border-radius: 8px; background: #2a2a3e; color: #fff; border: none; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-ctrl:active { background: var(--magenta); }
  .sens-val { width: 40px; text-align: center; font-family: monospace; font-size: 16px; font-weight: bold; color: var(--yellow); }

  .btn-tools {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;
  }
  .btn-tool {
    padding: 12px; border-radius: 10px; border: 1px solid #333;
    background: rgba(255,255,255,0.05); color: #fff; font-size: 13px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .btn-tool:active { background: rgba(255,255,255,0.1); }
  .btn-tool.random { border-color: var(--cyan); color: var(--cyan); }
  .btn-tool.kéo-tâm { border-color: var(--yellow); color: var(--yellow); }

  .btn-logout {
    margin-top: 20px; width: 100%; padding: 12px; background: transparent;
    border: 1px solid #555; color: #888; border-radius: 10px; font-weight: bold; cursor: pointer;
  }

  #toast { position:fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity:0; background:var(--ink); border:2px solid var(--cyan); color:var(--cyan); padding:10px 20px; border-radius:10px; font-weight:bold; transition:0.3s; z-index:99; pointer-events:none; }
  #toast.show { opacity:1; transform: translateX(-50%) translateY(0); }
  #toast.err { border-color:var(--danger); color:var(--danger); }
</style>
</head>
<body>

<!-- TRANG 1: ĐĂNG NHẬP BẰNG KEY -->
<div class="page active" id="pageLogin">
  <div class="login-card">
    <div class="login-title">SENS VIP IOS</div>
    <div style="font-size: 13px; color: var(--muted);">Nhập Key để mở khóa cấu hình</div>
    
    <div class="input-group">
      <label>Tên thiết bị của bạn</label>
      <input type="text" id="deviceName" placeholder="VD: iPhone 13 Pro Max..." autocomplete="off">
    </div>

    <div class="input-group">
      <label>Key kích hoạt</label>
      <input type="text" id="keyInput" placeholder="KEY-XXXX-XXXX-XXXX" maxlength="19" autocapitalize="characters">
    </div>

    <button class="btn-main" onclick="handleLogin()">KÍCH HOẠT NGAY</button>
  </div>
</div>

<!-- TRANG 2: BẢNG ĐIỀU KHIỂN ĐỘ NHẠY (Hiện sau khi Login) -->
<div class="page" id="pageDashboard">
  <div class="dash-header">
    <div class="user-info">
      Thiết bị: <b id="dispDevice">--</b>
    </div>
    <div class="timer" id="timerDisplay">00:00:00</div>
  </div>

  <div class="sens-container">
    <div class="sens-row">
      <div class="sens-name">Nhìn xung quanh</div>
      <div class="sens-ctrl">
        <button class="btn-ctrl" onclick="changeVal('look', -1)">-</button>
        <div class="sens-val" id="val-look">127</div>
        <button class="btn-ctrl" onclick="changeVal('look', 1)">+</button>
      </div>
    </div>
    
    <div class="sens-row">
      <div class="sens-name">Ống ngắm hồng tâm</div>
      <div class="sens-ctrl">
        <button class="btn-ctrl" onclick="changeVal('reddot', -1)">-</button>
        <div class="sens-val" id="val-reddot">162</div>
        <button class="btn-ctrl" onclick="changeVal('reddot', 1)">+</button>
      </div>
    </div>

    <div class="sens-row">
      <div class="sens-name">Ống ngắm 2x</div>
      <div class="sens-ctrl">
        <button class="btn-ctrl" onclick="changeVal('scope2', -1)">-</button>
        <div class="sens-val" id="val-scope2">87</div>
        <button class="btn-ctrl" onclick="changeVal('scope2', 1)">+</button>
      </div>
    </div>

    <div class="sens-row">
      <div class="sens-name">Ống ngắm 4x</div>
      <div class="sens-ctrl">
        <button class="btn-ctrl" onclick="changeVal('scope4', -1)">-</button>
        <div class="sens-val" id="val-scope4">169</div>
        <button class="btn-ctrl" onclick="changeVal('scope4', 1)">+</button>
      </div>
    </div>

    <div class="sens-row">
      <div class="sens-name">Súng ngắm (Sniper)</div>
      <div class="sens-ctrl">
        <button class="btn-ctrl" onclick="changeVal('sniper', -1)">-</button>
        <div class="sens-val" id="val-sniper">40</div>
        <button class="btn-ctrl" onclick="changeVal('sniper', 1)">+</button>
      </div>
    </div>

    <div class="sens-row">
      <div class="sens-name">Camera tự do</div>
      <div class="sens-ctrl">
        <button class="btn-ctrl" onclick="changeVal('free', -1)">-</button>
        <div class="sens-val" id="val-free">50</div>
        <button class="btn-ctrl" onclick="changeVal('free', 1)">+</button>
      </div>
    </div>
    
    <!-- Thêm % nút bắn theo yêu cầu -->
    <div class="sens-row">
      <div class="sens-name">% Nút bắn (Fire)</div>
      <div class="sens-ctrl">
        <button class="btn-ctrl" onclick="changeVal('fire', -1)">-</button>
        <div class="sens-val" id="val-fire">100</div>
        <button class="btn-ctrl" onclick="changeVal('fire', 1)">+</button>
      </div>
    </div>
  </div>

  <div class="btn-tools">
    <button class="btn-tool random" onclick="randomSens()">🎲 Random Độ Nhạy</button>
    <button class="btn-tool kéo-tâm" onclick="supportKéoTâm()">🎯 Hỗ Trợ Kéo Tâm</button>
  </div>

  <button class="btn-logout" onclick="handleLogout()">ĐĂNG XUẤT / ĐỔI KEY</button>
</div>

<div id="toast"></div>

<script>
  const SERVER_URL = "https://api-proxy-18ww.onrender.com";
  const $ = id => document.getElementById(id);

  let currentKey = null;
  let expiresAt = null;
  let timerInterval = null;

  // Dữ liệu độ nhạy
  let sensData = {
    look: 127, reddot: 162, scope2: 87, scope4: 169, sniper: 40, free: 50, fire: 100
  };

  // Hàm hiển thị thông báo
  function toast(msg, isErr = false) {
    const t = $("toast");
    t.textContent = msg;
    t.className = isErr ? "show err" : "show";
    setTimeout(() => t.className = "", 3000);
  }

  // Tự động format Key (thêm dấu gạch)
  $("keyInput").addEventListener("input", function() {
    let raw = this.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (raw.length > 3) {
      const rest = raw.slice(3, 15).match(/.{1,4}/g) || [];
      this.value = ["KEY", ...rest].join("-");
    } else {
      this.value = raw;
    }
  });

  // Cập nhật giao diện số liệu
  function updateUI() {
    for (let key in sensData) {
      const el = $(`val-${key}`);
      if (el) el.textContent = sensData[key];
    }
  }

  // Nút tăng giảm độ nhạy
  window.changeVal = (key, amount) => {
    let val = sensData[key] + amount;
    if (val > 200) val = 200;
    if (val < 0) val = 0;
    sensData[key] = val;
    updateUI();
  };

  // Hàm xử lý đăng nhập
  window.handleLogin = async () => {
    const key = $("keyInput").value.trim();
    const deviceName = $("deviceName").value.trim() || "Thiết bị ẩn danh";

    if (!key.match(/^KEY(-[A-Z0-9]{4}){3}$/)) {
      return toast("Sai định dạng Key!", true);
    }

    try {
      const res = await fetch(SERVER_URL + "/api/activate", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: key, device_name: deviceName })
      });
      const data = await res.json();

      if (data.ok) {
        toast("Kích hoạt thành công!");
        currentKey = key;
        expiresAt = data.expires_at; // Số giây hoặc null
        
        $("dispDevice").textContent = deviceName;
        
        // Chuyển trang
        $("pageLogin").classList.remove("active");
        $("pageDashboard").classList.add("active");

        // Bắt đầu đếm ngược (nếu có thời hạn)
        startTimer();
      } else {
        toast(data.message || "Key không hợp lệ!", true);
      }
    } catch (err) {
      toast("Lỗi kết nối Server!", true);
    }
  };

  // Hàm đăng xuất
  window.handleLogout = () => {
    currentKey = null;
    expiresAt = null;
    clearInterval(timerInterval);
    $("keyInput").value = "";
    $("pageDashboard").classList.remove("active");
    $("pageLogin").classList.add("active");
  };

  // Đồng hồ đếm ngược
  function startTimer() {
    clearInterval(timerInterval);
    const timerEl = $("timerDisplay");

    if (!expiresAt) {
      timerEl.textContent = "VĨNH VIỄN";
      timerEl.style.color = "var(--cyan)";
      return;
    }

    timerInterval = setInterval(() => {
      const now = Math.floor(Date.now() / 1000);
      const remaining = expiresAt - now;

      if (remaining <= 0) {
        clearInterval(timerInterval);
        timerEl.textContent = "HẾT HẠN";
        timerEl.style.color = "var(--danger)";
        toast("Key đã hết hạn! Đang đăng xuất...", true);
        setTimeout(handleLogout, 2000);
        return;
      }

      const h = String(Math.floor(remaining / 3600)).padStart(2, "0");
      const m = String(Math.floor((remaining % 3600) / 60)).padStart(2, "0");
      const s = String(remaining % 60).padStart(2, "0");

      timerEl.textContent = `${h}:${m}:${s}`;
      timerEl.style.color = "var(--magenta)";
    }, 1000);
  }

  // Các Tool tính năng
  window.randomSens = () => {
    sensData.look = Math.floor(Math.random() * 50) + 120;
    sensData.reddot = Math.floor(Math.random() * 40) + 140;
    sensData.scope2 = Math.floor(Math.random() * 30) + 80;
    sensData.scope4 = Math.floor(Math.random() * 40) + 150;
    sensData.sniper = Math.floor(Math.random() * 20) + 30;
    sensData.free = Math.floor(Math.random() * 50) + 40;
    sensData.fire = 100;
    updateUI();
    toast("Đã Random Độ Nhạy!", false);
  };

  window.supportKéoTâm = () => {
    // Đặt cấu hình theo kiểu kéo tâm (Hồng tâm cao, 4x cao, Sniper thấp)
    sensData.look = 150;
    sensData.reddot = 180;
    sensData.scope2 = 110;
    sensData.scope4 = 190;
    sensData.sniper = 35;
    sensData.free = 60;
    sensData.fire = 100;
    updateUI();
    toast("Đã nạp cấu hình Kéo Tâm!", false);
  };

  // Khởi tạo
  updateUI();

</script>
</body>
</html>
