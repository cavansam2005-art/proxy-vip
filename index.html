<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENS VIP – Kích hoạt Key</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#3DF2C8; --yellow:#FFE14D; --magenta:#FF2BD6; --ink:#1A0B2E;
    --extrude:#4B1F7A; --tv:#C9B3EE; --track-off:#7B4FD6; --muted:#B9A6E0; --danger:#FF6B8B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;}
  body{
    min-height:100dvh;
    background: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0/28px 28px, linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0/28px 28px, radial-gradient(ellipse at 80% 0%, #2a1850 0%, #120c1e 55%) #120c1e;
    background-attachment:fixed; font-family:"Baloo 2", system-ui, sans-serif; color:#fff;
    display:flex; flex-direction:column; align-items:center; overflow-x:hidden;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  
  .panel{width:300px;height:332px;position:relative;margin:0 auto;margin-bottom:20px}
  .content{position:absolute;left:36px;top:120px;width:228px;display:flex;flex-direction:column;gap:12px}
  
  .ip{display:flex;align-items:center;gap:7px;height:36px;width:100%;padding:0 10px;border:0;border-radius:9px;background:rgba(26,11,46,.75);box-shadow:inset 0 0 0 1px rgba(163,91,214,.55)}
  .ip .k{font-size:13px;color:var(--muted);white-space:nowrap}
  .ip .v{font-weight:700;font-size:13.5px;color:#fff;flex:1;text-align:right}
  
  .field{position:relative;height:58px;border-radius:11px;background:#170a2e;box-shadow:inset 0 0 0 1.5px var(--track-off);transition:box-shadow .12s}
  .field:focus-within{box-shadow:inset 0 0 0 2px var(--magenta), 3px 3px 0 0 var(--cyan)}
  .field.bad{box-shadow:inset 0 0 0 2px var(--danger), 3px 3px 0 0 rgba(255,107,139,.35)}
  .field label{position:absolute;left:13px;top:8px;font-size:10.5px;font-weight:700;color:var(--cyan);text-transform:uppercase}
  .field input{position:absolute;left:0;right:0;bottom:0;height:40px;width:100%;border:0;outline:0;background:transparent;padding:0 13px 4px;font-family:"JetBrains Mono",monospace;font-size:16px;color:#fff;text-transform:uppercase}
  
  .actions{display:flex;gap:10px;margin-top:2px}
  .cta{flex:1;height:52px;border:0;cursor:pointer;border-radius:11px;background:linear-gradient(#FF6BE6 52%, #FF2BD6 52%);box-shadow:inset 0 0 0 2px var(--ink), 0 0 0 1px var(--ink), 0 5px 0 1px var(--extrude);display:grid;place-items:center;transition:transform .06s}
  .cta:active{transform:translateY(4px);box-shadow:inset 0 0 0 2px var(--ink),0 0 0 1px var(--ink),0 1px 0 1px var(--extrude)}
  .trash{width:52px;height:52px;border:0;border-radius:11px;cursor:pointer;background:linear-gradient(#FF8A6B 52%, #FF3D5E 52%);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--ink),0 0 0 1px var(--ink),0 5px 0 1px var(--extrude)}

  /* GIAO DIỆN BẢNG ĐỘ NHẠY MỚI */
  .sens-dashboard{
    width: 100%; max-width: 380px; margin: 0 auto;
    background: rgba(23, 10, 46, 0.9);
    border: 1.5px solid rgba(163, 91, 214, 0.6);
    border-radius: 16px; padding: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(61, 242, 200, 0.05);
    backdrop-filter: blur(10px);
    display: none; flex-direction: column; gap: 15px;
    animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .sens-dashboard.show { display: flex; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .sens-header { text-align: center; border-bottom: 1px solid rgba(163, 91, 214, 0.3); padding-bottom: 12px; }
  .sens-header h2 { margin: 0; font-size: 18px; color: var(--cyan); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(61,242,200,0.5); }
  .sens-header p { margin: 5px 0 0; font-size: 11px; color: var(--muted); font-family: "JetBrains Mono"; }
  .device-badge { display: inline-block; background: var(--magenta); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin-top: 8px; font-weight: bold; }

  .sens-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sens-item { 
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); 
    border-radius: 10px; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .sens-item::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--cyan); }
  .sens-label { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
  .sens-value { font-size: 22px; font-weight: 900; color: var(--yellow); font-family: "JetBrains Mono"; text-shadow: 0 0 10px rgba(255,225,77,0.4); }

  .btn-copy-all {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, var(--cyan), #20b89b); color: var(--ink);
    font-size: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 4px 15px rgba(61, 242, 200, 0.3); margin-top: 5px;
  }
  .btn-copy-all:active { transform: scale(0.97); }

  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-20px);opacity:0;z-index:40;background:var(--ink);border:2px solid var(--magenta);box-shadow:3px 3px 0 var(--cyan);border-radius:10px;padding:8px 20px;font-size:14px;font-weight:600;transition:opacity .2s, transform .2s;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.ok{border-color:var(--cyan);color:var(--cyan)}
  #toast.err{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>

<div class="panel">
  <svg style="position:absolute;left:-62px;top:-62px;width:424px;height:456px;pointer-events:none;" viewBox="-62 -62 424 456">
    <defs>
      <path id="frame" d="M0,0 L-42,-34 L22,-10 L46,-26 L62,0 L98,0 L182,0 L220,0 L240,-22 L252,0 L270,-6 L336,-40 L300,28 L300,130 L310,140 L300,152 L300,300 L332,364 L278,332 L184,332 L174,344 L164,332 L18,332 L-28,358 L0,300 L0,200 L-11,190 L0,180 L0,80 L-20,48 L0,36 Z"/>
      <polygon id="emb" points="98,-8 114,-38 136,-32 150,-52 164,-32 186,-38 202,-8 190,22 166,36 150,28 134,36 110,22"/>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="332"><stop offset="0" stop-color="#3A1A7A"/><stop offset=".75" stop-color="#5B2DB0"/><stop offset="1" stop-color="#8E7BE8"/></linearGradient>
      <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4.5" cy="4.5" r="1.8" fill="#9FB4FF"/></pattern>
      <clipPath id="frameClip"><use href="#frame"/></clipPath>
    </defs>
    <use href="#frame" fill="none" stroke="#3DF2C8" stroke-width="24" transform="translate(4 3)"/>
    <use href="#frame" fill="none" stroke="#FFE14D" stroke-width="17" transform="translate(-3 -2)"/>
    <use href="#frame" fill="none" stroke="#FF2BD6" stroke-width="11"/>
    <use href="#frame" fill="url(#bodyGrad)"/>
    <g clip-path="url(#frameClip)"><rect x="-62" y="-62" width="424" height="456" fill="url(#dots)" opacity="0.5"/></g>
    <use href="#frame" fill="none" stroke="#1A0B2E" stroke-width="5"/>
    <rect x="22" y="104" width="256" height="212" rx="14" fill="#1E0E44" fill-opacity=".72" stroke="#A35BD6" stroke-width="2"/>
    <use href="#emb" fill="none" stroke="#FF2BD6" stroke-width="3" transform="translate(0 3)"/>
    <use href="#emb" fill="#7B3FE0" stroke="#FFE14D" stroke-width="5"/>
    <g transform="translate(150 -6)">
      <rect x="-22" y="-18" width="44" height="36" rx="7" fill="#C9B3EE" stroke="#1A0B2E" stroke-width="3"/>
      <rect x="-16" y="-13" width="32" height="24" rx="4" fill="#1A0B2E"/>
      <g id="eyes"><polygon points="-12,-7 -2,-3 -3,0.5 -12,-3" fill="#FF2BD6"/><polygon points="12,-7 12,-3 3,0.5 2,-3" fill="#FF2BD6"/></g>
    </g>
    <text x="150" y="55" fill="#fff" font-family="monospace" font-size="24" font-weight="900" text-anchor="middle" filter="drop-shadow(2px 2px 0 #000)">SENS VIP</text>
  </svg>

  <form class="content" id="form" novalidate autocomplete="off">
    <div class="ip">
      <span class="k">Hệ điều hành:</span>
      <span class="v" id="deviceType">Đang quét...</span>
    </div>
    <div class="field" id="field">
      <label for="key">Key của bạn</label>
      <input id="key" autocapitalize="characters" maxlength="19" placeholder="KEY-XXXX-XXXX-XXXX">
    </div>
    <div class="actions">
      <button class="cta" type="submit" id="cta">
        <span class="label" style="font-weight:900; font-size:15px; letter-spacing:2px; color:#fff; text-shadow:2px 2px 0 #000;">KÍCH HOẠT</span>
        <svg class="spin" style="display:none" width="22" height="30" viewBox="-5.5 -9.5 11 19"><polygon points="2,-9 -5,1 -0.5,1 -2,9 5,-1 0.5,-1" fill="#FFE14D" stroke="#1A0B2E" stroke-width="1.2"/></svg>
      </button>
      <button class="trash" type="button" id="clear">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
    </div>
  </form>
</div>

<!-- DASHBOARD ĐỘ NHẠY XỊN HƠN -->
<div class="sens-dashboard" id="sensDashboard">
  <div class="sens-header">
    <h2>Cấu Hình Độ Nhạy</h2>
    <p>Gói VIP - Headshot Dễ Dàng</p>
    <div class="device-badge" id="badgeDevice">iOS</div>
  </div>
  
  <div class="sens-grid" id="sensGrid">
    <!-- Dữ liệu sẽ được JS đổ vào đây -->
  </div>

  <button class="btn-copy-all" onclick="copyConfig()">SAO CHÉP CẤU HÌNH</button>
</div>

<div id="toast"></div>

<script>
(() => {
  const SERVER_URL = "https://api-proxy-18ww.onrender.com";
  const $ = id => document.getElementById(id);

  // 1. Tự động nhận diện thiết bị
  let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  $("deviceType").textContent = isIOS ? "iOS (iPhone/iPad)" : "Android";
  $("badgeDevice").textContent = isIOS ? "CẤU HÌNH CHO iOS" : "CẤU HÌNH CHO ANDROID";

  function formatKey(v) {
    let raw = v.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!raw.startsWith("KEY") || raw.length <= 3) return raw.slice(0, 19);
    const rest = raw.slice(3, 15).match(/.{1,4}/g) || [];
    return ["KEY", ...rest].join("-");
  }

  const input = $("key"), field = $("field"), cta = $("cta");

  input.addEventListener("input", () => {
    const f = formatKey(input.value);
    if (f !== input.value) { input.value = f; }
    field.classList.remove("bad", "good");
  });

  let toastTimer = 0;
  function toast(msg, type) {
    const t = $("toast");
    t.className = type || "";
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
  }

  $("clear").addEventListener("click", () => {
    input.value = ""; field.classList.remove("bad", "good"); input.focus();
    $("sensDashboard").classList.remove("show");
  });

  // Hàm copy toàn bộ cấu hình
  window.copyConfig = () => {
    const items = document.querySelectorAll('.sens-item');
    let text = `CẤU HÌNH ĐỘ NHẠY VIP (${isIOS ? 'iOS' : 'Android'})\n\n`;
    items.forEach(item => {
      const label = item.querySelector('.sens-label').textContent;
      const val = item.querySelector('.sens-value').textContent;
      text += `${label}: ${val}\n`;
    });
    text += `\nChúc bạn chơi game vui vẻ!`;
    
    navigator.clipboard.writeText(text).then(() => toast("Đã Copy Toàn Bộ Cấu Hình!", "ok"));
  };

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const key = input.value.trim().toUpperCase();
    
    if (!key.match(/^KEY(-[A-Z0-9]{4}){3}$/)) {
      toast("Sai định dạng key", "err"); field.classList.add("bad"); return;
    }

    cta.classList.add("loading"); cta.disabled = true;
    cta.querySelector('.label').style.display = 'none';
    cta.querySelector('.spin').style.display = 'block';

    try {
      const res = await fetch(SERVER_URL + "/api/activate", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: key })
      });
      const data = await res.json();

      if (data.ok) {
        field.classList.add("good");
        toast("Kích hoạt thành công!", "ok");
        
        // Lấy dữ liệu độ nhạy tương ứng với thiết bị
        const config = isIOS ? data.sens_config.ios : data.sens_config.android;
        
        // Render giao diện bảng độ nhạy
        const grid = $("sensGrid");
        grid.innerHTML = `
          <div class="sens-item"><span class="sens-label">General</span><span class="sens-value">${config.general}</span></div>
          <div class="sens-item"><span class="sens-label">Red Dot</span><span class="sens-value">${config.redDot}</span></div>
          <div class="sens-item"><span class="sens-label">2x Scope</span><span class="sens-value">${config.scope2x}</span></div>
          <div class="sens-item"><span class="sens-label">4x Scope</span><span class="sens-value">${config.scope4x}</span></div>
          <div class="sens-item"><span class="sens-label">Sniper</span><span class="sens-value">${config.sniper}</span></div>
          <div class="sens-item"><span class="sens-label">Free Look</span><span class="sens-value">${config.freeLook}</span></div>
        `;
        
        $("sensDashboard").classList.add("show");
        setTimeout(() => $("sensDashboard").scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);

      } else {
        field.classList.add("bad");
        toast(data.message || "Lỗi kích hoạt", "err");
        $("sensDashboard").classList.remove("show");
      }
    } catch (err) {
      toast("Không kết nối được máy chủ", "err"); field.classList.add("bad");
    } finally {
      cta.classList.remove("loading"); cta.disabled = false;
      cta.querySelector('.label').style.display = 'block';
      cta.querySelector('.spin').style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
