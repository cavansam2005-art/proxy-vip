<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAMM VIP IOS - COSMIC EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:   #22d3ee;
            --secondary: #a855f7;
            --accent:    #f0abfc;
            --gold:      #fbbf24;
            --emerald:   #34d399;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #02040a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .cosmic-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2;
            background: linear-gradient(-45deg, #02040a, #071a2e, #0d0524, #041d24, #12082b);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
        }
        @keyframes gradientBG {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .cosmic-bg::after {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(34, 211, 238, 0.15), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.15), transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(240, 171, 252, 0.06), transparent 60%);
            pointer-events: none;
        }

        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .particle {
            position: absolute; display: block; border-radius: 50%;
            background: rgba(34, 211, 238, 0.75);
            box-shadow: 0 0 8px rgba(34, 211, 238, 0.9), 0 0 16px rgba(168, 85, 247, 0.4);
            animation: floatUp linear infinite;
            bottom: -10px;
        }
        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .glass-card {
            background: rgba(6, 12, 24, 0.55);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border: 1px solid rgba(34, 211, 238, 0.12);
            border-top: 1px solid rgba(34, 211, 238, 0.28);
            border-left: 1px solid rgba(34, 211, 238, 0.28);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.65), inset 0 0 30px rgba(34, 211, 238, 0.06);
            padding: 32px 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        .text-gradient {
            background: linear-gradient(120deg, #22d3ee 0%, #a855f7 50%, #f0abfc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradientShift 6s ease infinite;
            text-shadow: 0 0 40px rgba(34, 211, 238, 0.35);
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(34, 211, 238, 0.15);
            color: #fff;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.55);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15), 0 0 25px rgba(34, 211, 238, 0.25);
            outline: none;
            transform: translateY(-2px);
        }

        .btn-cosmic {
            background: linear-gradient(135deg, #06b6d4 0%, #22d3ee 25%, #a855f7 75%, #d946ef 100%);
            background-size: 200% 200%;
            border: none; color: #fff;
            box-shadow: 0 10px 25px -5px rgba(34, 211, 238, 0.45), 0 0 30px rgba(168, 85, 247, 0.25);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .btn-cosmic:hover {
            background-position: 100% 50%;
            box-shadow: 0 15px 35px -5px rgba(34, 211, 238, 0.65), 0 0 45px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px) scale(1.02);
        }
        .btn-cosmic:active { transform: translateY(0) scale(0.98); }

        .btn-sub {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(34, 211, 238, 0.15);
            color: #cbd5e1; transition: all 0.3s ease;
        }
        .btn-sub:hover {
            background: rgba(34, 211, 238, 0.08);
            border-color: rgba(34, 211, 238, 0.5);
            color: #fff;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.25);
            transform: translateY(-1px);
        }
        
        .disabled { opacity: 0.5; pointer-events: none; filter: grayscale(50%); }

        #statusBox {
            background: rgba(6, 12, 24, 0.45) !important;
            border: 1px solid rgba(34, 211, 238, 0.15) !important;
            box-shadow: inset 0 0 25px rgba(34, 211, 238, 0.05), inset 0 0 40px rgba(168, 85, 247, 0.03) !important;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="cosmic-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="w-full max-w-[420px] z-10 space-y-6">
        
        <div class="flex items-center justify-between px-2">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-gradient">SAMM VIP IOS</h1>
                <p class="text-[10px] font-bold text-cyan-300 tracking-[0.3em] uppercase mt-1 opacity-80"></p>
            </div>
            <div class="bg-white/5 border border-white/10 px-3 py-1.5 rounded-full flex flex-col items-end backdrop-blur-md shadow-lg">
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full shadow-[0_0_10px_#34d399] animate-pulse"></span>
                    <span class="text-[10px] font-bold text-white tracking-widest uppercase">ONLINE</span>
                </div>
                <div class="text-[9px] text-white/50 font-mono mt-0.5">
                    IP: <span class="text-cyan-400" id="ipDisplay">...</span>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <form id="mainForm" class="space-y-6" onsubmit="return false;">
                
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-white/60 uppercase tracking-widest flex items-center gap-2 ml-1">
                        <i class="fa-solid fa-key text-cyan-400"></i> License Token
                    </label>
                    <input type="text" id="keyInput" placeholder="KEY-XXXX-XXXX-XXXX" autocomplete="off"
                    class="glass-input w-full rounded-2xl py-4 px-4 text-sm font-mono tracking-wider text-center uppercase">
                </div>

                <div id="statusBox" class="hidden flex-col p-4 rounded-2xl">
                    <div class="flex items-center justify-between mb-4 border-b border-white/10 pb-3">
                        <span class="px-2.5 py-1 rounded bg-black/30 text-white/70 text-[10px] font-mono border border-white/5" id="clientIpDisplay">Fetching...</span>
                        <div class="flex items-center gap-1.5 text-cyan-300 text-[11px] font-mono font-bold bg-cyan-500/10 px-2.5 py-1 rounded border border-cyan-500/20">
                            <i class="fa-solid fa-clock"></i> <span id="countdownTimer">--:--:--</span>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500/20 to-violet-500/20 border border-white/10 flex items-center justify-center">
                                <i class="fa-solid fa-satellite-dish text-white/90 text-lg"></i>
                            </div>
                            <div>
                                <p class="text-[9px] font-bold text-white/50 uppercase tracking-[0.2em]">Status</p>
                                <p class="text-[15px] font-extrabold text-emerald-400 tracking-wide">ACTIVATED</p>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="button" id="btn-submit-main" onclick="handleActivate()" class="w-full py-4 rounded-2xl btn-cosmic font-extrabold text-[13px] uppercase tracking-[0.2em] flex items-center justify-center gap-2 h-14">
                    <span id="btnText" class="z-10">INITIALIZE LINK</span> <i class="fa-solid fa-bolt z-10 text-white/80 text-[11px]"></i>
                </button>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <a href="https://mitm.it" target="_blank" class="py-3.5 rounded-xl btn-sub font-bold text-[10px] uppercase tracking-widest flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download text-cyan-400"></i> TẢI CA
                    </a>
                    <a href="https://zalo.me" target="_blank" class="py-3.5 rounded-xl btn-sub font-bold text-[10px] uppercase tracking-widest flex items-center justify-center gap-2">
                        <i class="fa-solid fa-headset text-violet-400"></i> HỖ TRỢ
                    </a>
                </div>
            </form>
        </div>
        
        <div class="text-center pb-4">
            <p class="text-[10px] text-white/30 font-mono tracking-widest">
                <i class="fa-solid fa-terminal text-[8px]"></i> SAMM VIP IOS
            </p>
        </div>
    </div>

    <div id="toast" style="position:fixed;top:20px;left:50%;transform:translate(-50%, -20px);opacity:0;visibility:hidden;z-index:99999;width:90%;max-width:380px;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);">
        <div id="toastContent" class="p-4 rounded-2xl text-[13px] font-medium text-white flex items-center gap-3 bg-black/80 backdrop-blur-md border border-cyan-500/30 shadow-lg"></div>
    </div>

    <script>
        // Cấu hình API Server Render của bạn
        const API_URL = "https://api-proxy-18ww.onrender.com";

        let clientIP = null;
        let expiresAt = null;
        let countdownInterval = null;

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 25; i++) {
                let p = document.createElement('div');
                p.classList.add('particle');
                let size = Math.random() * 4 + 1;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 10 + 10) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.opacity = Math.random() * 0.5 + 0.1;
                container.appendChild(p);
            }
        }
        createParticles();

        function showToast(msg, isError = false) {
            const icon = isError ? '<i class="fa-solid fa-circle-xmark text-red-400"></i>' : '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
            const t = document.getElementById('toast'), tc = document.getElementById('toastContent');
            tc.innerHTML = `${icon} <span class="tracking-wide">${msg}</span>`;
            t.style.opacity = '1'; t.style.visibility = 'visible'; t.style.transform = 'translate(-50%, 0)';
            setTimeout(() => { t.style.opacity = '0'; t.style.visibility = 'hidden'; t.style.transform = 'translate(-50%, -20px)'; }, 3000);
        }

        function getDeviceId() {
            let d = localStorage.getItem("proxy_device_id");
            if (!d) {
                d = "dev-" + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
                localStorage.setItem("proxy_device_id", d);
            }
            return d;
        }

        async function fetchRealIP() {
            try {
                const resp = await fetch(API_URL + '/api/whoami');
                const data = await resp.json();
                clientIP = data.ip;
                document.getElementById('ipDisplay').innerText = clientIP;
                document.getElementById('clientIpDisplay').innerText = clientIP;
            } catch(e) {
                document.getElementById('ipDisplay').innerText = 'Error';
            }
        }

        function startCountdown(exp) {
            if (countdownInterval) clearInterval(countdownInterval);
            expiresAt = exp;
            const timer = document.getElementById('countdownTimer');
            const box = document.getElementById('statusBox');
            box.classList.remove('hidden'); box.classList.add('flex');
            
            countdownInterval = setInterval(() => {
                const rem = expiresAt - Math.floor(Date.now() / 1000);
                if (rem <= 0) {
                    timer.innerText = 'EXPIRED';
                    timer.style.color = '#ef4444';
                    clearInterval(countdownInterval);
                } else {
                    const h = String(Math.floor(rem / 3600)).padStart(2, '0');
                    const m = String(Math.floor((rem % 3600) / 60)).padStart(2, '0');
                    const s = String(rem % 60).padStart(2, '0');
                    timer.innerText = `${h}:${m}:${s}`;
                }
            }, 1000);
        }

        async function handleActivate() {
            const keyInput = document.getElementById('keyInput');
            const key = keyInput.value.trim().toUpperCase();
            const btn = document.getElementById('btn-submit-main');
            const btnText = document.getElementById('btnText');

            if (!key) return showToast("Vui lòng nhập Key", true);
            if (!key.match(/^KEY(-[A-Z0-9]{4}){3}$/)) return showToast("Định dạng Key không đúng", true);
            if (!clientIP) return showToast("Đang lấy IP, vui lòng đợi...", true);

            btn.disabled = true;
            btnText.innerText = "ACTIVATING...";

            try {
                const resp = await fetch(API_URL + '/api/activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, ip: clientIP, device_id: getDeviceId() })
                });
                const data = await resp.json();

                if (data.ok) {
                    showToast("Kích hoạt thành công!");
                    btnText.innerText = "ACTIVATED";
                    
                    if (data.expires_at) {
                        startCountdown(data.expires_at);
                    } else {
                        document.getElementById('statusBox').classList.remove('hidden');
                        document.getElementById('statusBox').classList.add('flex');
                        document.getElementById('countdownTimer').innerText = 'VĨNH VIỄN';
                    }
                    
                    localStorage.setItem("saved_key", key);
                } else {
                    showToast(data.message || "Lỗi kích hoạt", true);
                    btn.disabled = false;
                    btnText.innerText = "INITIALIZE LINK";
                }
            } catch(e) {
                showToast("Không kết nối được máy chủ", true);
                btn.disabled = false;
                btnText.innerText = "INITIALIZE LINK";
            }
        }

        async function checkSavedKey() {
            const savedKey = localStorage.getItem("saved_key");
            if (savedKey) {
                document.getElementById('keyInput').value = savedKey;
                try {
                    const resp = await fetch(API_URL + '/api/status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key: savedKey, device_id: getDeviceId() })
                    });
                    const data = await resp.json();
                    if (data.state === "active") {
                        document.getElementById('btnText').innerText = "ACTIVATED";
                        if (data.expires_at) startCountdown(data.expires_at);
                    }
                } catch(e) {}
            }
        }

        (async function init() {
            await fetchRealIP();
            await checkSavedKey();
            setInterval(() => { const el = document.getElementById('ipDisplay'); if (el) el.innerText = clientIP; }, 5000);
        })();
    </script>
</body>
</html>
