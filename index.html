<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kênh Link TikTok - ShopLink</title>
  <style>
    body { background: #0a0a0c; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
    .container { max-width: 680px; width: 100%; background: #121216; padding: 20px; border-radius: 20px; border: 1px solid #333; }
    h1 { text-align: center; background: linear-gradient(45deg, #ff7a00, #fe2c55, #25f4ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .input-box { display: flex; gap: 10px; margin-top: 20px; }
    .input-box input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #25f4ee; background: #000; color: #25f4ee; font-weight: bold; text-transform: uppercase; }
    .input-box button { padding: 12px 20px; border-radius: 8px; border: none; background: linear-gradient(45deg, #ff7a00, #fe2c55, #25f4ee); font-weight: bold; cursor: pointer; }
    .link-card { background: #1a1a20; border-left: 4px solid #25f4ee; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .btn-open { background: linear-gradient(90deg, #ff2c55, #ff7a00, #25f4ee); border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; }
    .hidden { display: none; }
    
    /* CSS cho khung Mã thiết bị */
    .device-box { margin-top: 20px; text-align: center; }
    .device-divider { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .device-divider .line { flex: 1; height: 1px; background: #333; }
    .device-divider .text { font-size: 11px; color: #888; text-transform: uppercase; }
    .device-id { background: #000; padding: 10px; border-radius: 8px; border: 1px dashed #555; font-family: monospace; color: #25f4ee; word-break: break-all; cursor: pointer; }
    .device-id:hover { border-color: #25f4ee; }
  </style>
</head>
<body>

<div class="container">
  <!-- Màn hình chưa kích hoạt -->
  <div id="unauthView">
    <h1>ShopLink</h1>
    <p style="text-align: center; color: #888;">Nhập Mã Key để mở khóa hệ thống link</p>
    
    <div class="input-box">
      <input type="text" id="keyInput" placeholder="VIP-XXXX-XXXX-XXXX">
      <button onclick="activateKey()">⚡ Kích Hoạt</button>
    </div>
    <p id="errorMsg" style="color: #ef4444; text-align: center; margin-top: 10px;"></p>

    <!-- Khung hiển thị mã thiết bị -->
    <div class="device-box">
      <div class="device-divider">
        <div class="line"></div>
        <span class="text">Mã Thiết Bị Của Bạn</span>
        <div class="line"></div>
      </div>
      <div class="device-id" id="deviceIdDisplay" onclick="copyDeviceId()" title="Bấm để sao chép">
        Đang tải...
      </div>
      <p style="font-size: 11px; color: #888; margin-top: 8px;">Gửi mã này cho Admin nếu bạn muốn được cấp quyền trực tiếp.</p>
    </div>
  </div>

  <!-- Màn hình đã kích hoạt -->
  <div id="authView" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1>Kênh Link TikTok</h1>
      <span style="color: #25f4ee; font-weight: bold;">✓ Đã kích hoạt</span>
    </div>
    
    <div id="linksList"></div>
  </div>
</div>

<script>
  const SERVER_URL = "https://api-proxy-18ww.onrender.com"; 
  
  // Khởi tạo hoặc lấy ID thiết bị
  let deviceId = localStorage.getItem('device_id');
  if (!deviceId) {
    deviceId = 'device_' + Math.random().toString(36).substring(2, 15);
    localStorage.setItem('device_id', deviceId);
  }

  // Hiển thị mã thiết bị lên màn hình
  document.getElementById('deviceIdDisplay').innerText = deviceId;

  // Hàm copy ID thiết bị
  function copyDeviceId() {
    navigator.clipboard.writeText(deviceId).then(() => {
      const el = document.getElementById('deviceIdDisplay');
      const oldText = el.innerText;
      el.innerText = "Đã sao chép!";
      el.style.color = "#10b981";
      setTimeout(() => { el.innerText = oldText; el.style.color = "#25f4ee"; }, 1500);
    });
  }

  // Hàm kích hoạt Key
  async function activateKey() {
    const key = document.getElementById('keyInput').value.trim().toUpperCase();
    const errMsg = document.getElementById('errorMsg');
    if (!key) return errMsg.innerText = "Vui lòng nhập Key!";

    try {
      const res = await fetch(SERVER_URL + '/api/activate-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: key, device_id: deviceId })
      });
      const data = await res.json();
      
      if (data.success) {
        checkAuth(); 
      } else {
        errMsg.innerText = data.error || "Key không đúng!";
      }
    } catch (e) {
      errMsg.innerText = "Lỗi kết nối Server!";
    }
  }

  // Hàm kiểm tra quyền và load link
  async function checkAuth() {
    try {
      const res = await fetch(SERVER_URL + '/api/check-auth?device_id=' + deviceId);
      const data = await res.json();

      if (data.authorized) {
        document.getElementById('unauthView').classList.add('hidden');
        document.getElementById('authView').classList.remove('hidden');
        loadLinks();
      } else {
        document.getElementById('unauthView').classList.remove('hidden');
        document.getElementById('authView').classList.add('hidden');
      }
    } catch (e) {
      console.log("Lỗi check auth", e);
    }
  }

  // Hàm lấy danh sách link
  async function loadLinks() {
    try {
      const res = await fetch(SERVER_URL + '/api/v2/feed/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: deviceId })
      });
      const data = await res.json();
      
      const listEl = document.getElementById('linksList');
      if (data.links) {
        listEl.innerHTML = Object.keys(data.links).map(key => `
          <div class="link-card">
            <div>
              <div style="font-weight: bold; color: #25f4ee;">/${key}</div>
              <div style="font-size: 12px; color: #888;">${data.links[key].created_at}</div>
            </div>
            <button class="btn-open" onclick="openLink('${key}')">Mở Link</button>
          </div>
        `).join('');
      } else {
        listEl.innerHTML = "<p style='text-align:center;'>Chưa có link nào.</p>";
      }
    } catch (e) {
      console.log("Lỗi load link", e);
    }
  }

  // Hàm mở link
  async function openLink(shopId) {
    try {
      const res = await fetch(SERVER_URL + '/api/v2/feed/claim-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ shop_id: shopId })
      });
      const data = await res.json();
      if (data.url) {
        window.location.href = data.url; 
      }
    } catch (e) {
      alert("Lỗi mở link!");
    }
  }

  checkAuth();
</script>

</body>
</html>
