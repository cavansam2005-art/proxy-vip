<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proxy VIP – Active Key</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#3DF2C8; --yellow:#FFE14D; --magenta:#FF2BD6; --ink:#1A0B2E;
    --extrude:#4B1F7A; --lavender:#E3CCF7; --tv:#C9B3EE; --stroke:#A35BD6;
    --field:#170a2e; --track-off:#7B4FD6; --muted:#B9A6E0; --label:#F3E8FA; --danger:#FF6B8B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;}
  body{
    min-height:100dvh;
    background: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0/28px 28px, linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0/28px 28px, radial-gradient(ellipse at 80% 0%, #2a1850 0%, #120c1e 55%) #120c1e;
    background-attachment:fixed; font-family:"Baloo 2", system-ui, sans-serif; color:var(--label);
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow-x:hidden;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .stage{position:relative}
  .panel{position:absolute;left:0;top:0;width:300px;height:332px;transform-origin:0 0}
  .art{position:absolute;left:-62px;top:-62px;width:424px;height:456px;pointer-events:none;overflow:visible}
  .content{position:absolute;left:36px;top:120px;width:228px;display:flex;flex-direction:column;gap:12px}
  .ip{display:flex;align-items:center;gap:7px;height:36px;width:100%;padding:0 10px;border:0;border-radius:9px;cursor:pointer;font:inherit;text-align:left;color:inherit;background:rgba(26,11,46,.75);box-shadow:inset 0 0 0 1px rgba(163,91,214,.55)}
  .ip .k{font-size:13px;color:var(--muted);white-space:nowrap}
  .ip .v{font-weight:700;font-size:13.5px;text-align:right;letter-spacing:.01em;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .field{position:relative;height:58px;border-radius:11px;background:var(--field);box-shadow:inset 0 0 0 1.5px var(--track-off), 3px 3px 0 0 rgba(61,242,200,0);transition:box-shadow .12s}
  .field:focus-within{box-shadow:inset 0 0 0 2px var(--magenta), 3px 3px 0 0 var(--cyan)}
  .field.bad{box-shadow:inset 0 0 0 2px var(--danger), 3px 3px 0 0 rgba(255,107,139,.35)}
  .field.good{box-shadow:inset 0 0 0 2px var(--cyan), 3px 3px 0 0 var(--magenta)}
  .field label{position:absolute;left:13px;top:8px;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
  .field input{position:absolute;left:0;right:0;bottom:0;height:40px;width:100%;border:0;outline:0;background:transparent;padding:0 13px 4px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:16px;letter-spacing:.04em;color:#fff;caret-color:var(--magenta);text-transform:uppercase}
  .field input::placeholder{color:rgba(185,166,224,.45)}
  .actions{display:flex;gap:10px;margin-top:2px}
  .cta{position:relative;flex:1;height:52px;border:0;padding:0;cursor:pointer;border-radius:11px;background:linear-gradient(#FF6BE6 52%, #FF2BD6 52%);box-shadow:inset 0 0 0 2px var(--ink), 0 0 0 1px var(--ink), 0 5px 0 1px var(--extrude);display:grid;place-items:center;transition:transform .06s, box-shadow .06s}
  .cta:active{transform:translateY(4px);box-shadow:inset 0 0 0 2px var(--ink),0 0 0 1px var(--ink),0 1px 0 1px var(--extrude)}
  .cta svg{display:block;shape-rendering:crispEdges}
  .cta .spin{display:none}
  .cta.loading .label{display:none}
  .cta.loading .spin{display:block;animation:zap .5s steps(2) infinite}
  @keyframes zap{50%{transform:scale(1.15) rotate(-8deg)}}
  .trash{width:52px;height:52px;flex:none;border:0;border-radius:11px;cursor:pointer;padding:0;background:linear-gradient(#FF8A6B 52%, #FF3D5E 52%);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--ink),0 0 0 1px var(--ink),0 5px 0 1px var(--extrude)}
  .trash svg{display:block;shape-rendering:crispEdges;overflow:visible}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-20px);opacity:0;z-index:40;background:var(--ink);border:2px solid var(--magenta);box-shadow:3px 3px 0 var(--cyan);border-radius:10px;padding:6px 16px;font-size:14px;font-weight:600;transition:opacity .15s, transform .15s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast{display:flex;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 24px);white-space:normal;line-height:1.3}
  #toast svg{flex:none}
  #toast.ok{border-color:var(--cyan);box-shadow:3px 3px 0 var(--magenta);color:var(--cyan)}
  #toast.err{border-color:var(--danger);box-shadow:3px 3px 0 var(--ink);color:var(--danger)}
  .proxy-guide{margin-top: 22px; width: 100%; max-width: 360px; background: rgba(23, 10, 46, 0.88); border: 1.5px solid rgba(163, 91, 214, 0.55); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); z-index: 10;}
  .proxy-guide.hidden{display: none !important;}
  .guide-title{display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; color: var(--cyan); text-transform: uppercase;}
  .guide-row{display: flex; justify-content: space-between; align-items: center; font-size: 13px; border-bottom: 1px solid rgba(163, 91, 214, 0.2); padding-bottom: 6px;}
  .guide-label{ color: var(--muted); }
  .guide-val{ color: #fff; font-weight: 600; font-family: "JetBrains Mono", monospace; font-size: 12.5px; }
  .guide-val b{ color: var(--yellow); }
</style>
</head>
<body>

<div class="stage" id="stage">
  <main class="panel" id="panel">
    <svg class="art" id="art" viewBox="-62 -62 424 456" aria-hidden="true">
      <defs>
        <path id="frame" d="M0,0 L-42,-34 L22,-10 L46,-26 L62,0 L98,0 L182,0 L220,0 L240,-22 L252,0 L270,-6 L336,-40 L300,28 L300,130 L310,140 L300,152 L300,300 L332,364 L278,332 L184,332 L174,344 L164,332 L18,332 L-28,358 L0,300 L0,200 L-11,190 L0,180 L0,80 L-20,48 L0,36 Z"/>
        <polygon id="emb" points="98,-8 114,-38 136,-32 150,-52 164,-32 186,-38 202,-8 190,22 166,36 150,28 134,36 110,22"/>
        <linearGradient id="bodyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="332"><stop offset="0" stop-color="#3A1A7A"/><stop offset=".75" stop-color="#5B2DB0"/><stop offset="1" stop-color="#8E7BE8"/></linearGradient>
        <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4.5" cy="4.5" r="1.8" fill="#9FB4FF"/></pattern>
        <mask id="dotMask"><rect x="-62" y="-62" width="424" height="456" fill="#fff"/></mask>
        <clipPath id="frameClip"><use href="#frame"/></clipPath>
      </defs>
      <use href="#frame" fill="none" stroke="#3DF2C8" stroke-width="24" stroke-linejoin="miter" transform="translate(4 3)"/>
      <use href="#frame" fill="none" stroke="#FFE14D" stroke-width="17" stroke-linejoin="miter" transform="translate(-3 -2)"/>
      <use href="#frame" fill="none" stroke="#FF2BD6" stroke-width="11" stroke-linejoin="miter"/>
      <use href="#frame" fill="url(#bodyGrad)"/>
      <g clip-path="url(#frameClip)">
        <rect x="-62" y="-62" width="424" height="456" fill="url(#dots)" mask="url(#dotMask)"/>
      </g>
      <use href="#frame" fill="none" stroke="#1A0B2E" stroke-width="5" stroke-linejoin="miter"/>
      <rect x="22" y="104" width="256" height="212" rx="14" fill="#1E0E44" fill-opacity=".72" stroke="#A35BD6" stroke-width="2"/>
      <use href="#emb" fill="none" stroke="#FF2BD6" stroke-width="3" transform="translate(0 3)"/>
      <use href="#emb" fill="#7B3FE0" stroke="#FFE14D" stroke-width="5" stroke-linejoin="miter"/>
      <g transform="translate(150 -6)">
        <rect x="-22" y="-18" width="44" height="36" rx="7" fill="#C9B3EE" stroke="#1A0B2E" stroke-width="3"/>
        <rect x="-16" y="-13" width="32" height="24" rx="4" fill="#1A0B2E"/>
        <g id="eyes"><polygon points="-12,-7 -2,-3 -3,0.5 -12,-3" fill="#FF2BD6"/><polygon points="12,-7 12,-3 3,0.5 2,-3" fill="#FF2BD6"/></g>
      </g>
    </svg>

    <form class="content" id="form" novalidate autocomplete="off">
      <button class="ip" type="button" id="copyIp">
        <span class="k">IP của bạn:</span>
        <span class="v" id="ip" aria-live="polite">đang lấy…</span>
      </button>
      <div class="field" id="field">
        <label for="key">Key của bạn</label>
        <input id="key" name="key" autocapitalize="characters" maxlength="19" placeholder="KEY-XXXX-XXXX-XXXX">
      </div>
      <div class="actions">
        <button class="cta" type="submit" id="cta">
          <span class="label" style="font-weight:900; font-size:15px; letter-spacing:2px; color:#fff; text-shadow:2px 2px 0 #000;">ACTIVE IP</span>
          <svg class="spin" width="22" height="30" viewBox="-5.5 -9.5 11 19"><polygon points="2,-9 -5,1 -0.5,1 -2,9 5,-1 0.5,-1" fill="#FFE14D" stroke="#1A0B2E" stroke-width="1.2" stroke-linejoin="round"/></svg>
        </button>
        <button class="trash" type="button" id="clear">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
      </div>
    </form>
  </main>
</div>

<div class="proxy-guide hidden" id="proxyGuide">
  <div class="guide-title"><span>THÔNG TIN KẾT NỐI PROXY</span></div>
  <div class="guide-row"><span class="guide-label">Máy chủ (Host):</span><span class="guide-val" id="proxyHost">dhieushop.click</span></div>
  <div class="guide-row"><span class="guide-label">Cổng (Port):</span><span class="guide-val"><b>7776</b> (FAKHER) &bull; <b>7777</b> (Thường) &bull; <b>7778</b> (VIP Mod) &bull; <b>7779</b> (Siêu VIP Speed)</span></div>
  <div class="guide-row" id="guideHsdRow" style="display:none;"><span class="guide-label">Hạn sử dụng:</span><span class="guide-val" id="guideHsd" style="color:var(--cyan);">—</span></div>
</div>

<div id="toast"></div>

<script>
(() => {
  "use strict";

  // ===== CẤU HÌNH LINK SERVER RENDER CỦA BẠN =====
  const SERVER_URL = "https://api-proxy-18ww.onrender.com";

  const $ = id => document.getElementById(id);
  let currentIp = "";

  function getDeviceId() {
    let d = localStorage.getItem("proxy_device_id");
    if (!d) {
      d = "dev-" + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
      localStorage.setItem("proxy_device_id", d);
    }
    return d;
  }

  function layout() {
    const W = document.documentElement.clientWidth, H = window.innerHeight;
    const S = Math.max(0.7, Math.min(1.4, (W - 20) / 408, (H - 24) / 440));
    $("stage").style.width = (408 * S) + "px";
    $("stage").style.height = (438 * S) + "px";
    const base = `translate(${54 * S}px, ${56 * S}px) scale(${S})`;
    $("panel").style.transform = base;
  }
  addEventListener("resize", layout); layout();

  async function loadIp() {
    try {
      const r = await fetch(SERVER_URL + "/api/whoami", { cache: "no-store" });
      const data = await r.json();
      currentIp = data.ip || "";
    } catch (e) {
      try {
        const r2 = await fetch("https://api.ipify.org?format=json");
        currentIp = (await r2.json()).ip;
      } catch (e2) { currentIp = ""; }
    }
    $("ip").textContent = currentIp || "không xác định";
  }
  loadIp();

  function showGuide(expires) {
    if (expires) {
      let d = new Date(typeof expires === "number" ? expires * 1000 : expires);
      if (!isNaN(d.getTime())) {
        $("guideHsd").textContent = d.toLocaleDateString("vi-VN") + " " + d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
        $("guideHsdRow").style.display = "flex";
      }
    }
    $("proxyGuide").classList.remove("hidden");
  }

  let toastTimer = 0;
  function toast(msg, type) {
    const t = $("toast");
    t.className = type || "";
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer); 
    toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
  }

  function formatKey(v) {
    let raw = v.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!raw.startsWith("KEY") || raw.length <= 3) return raw.slice(0, 19);
    const rest = raw.slice(3, 15).match(/.{1,4}/g) || [];
    return ["KEY", ...rest].join("-");
  }

  const input = $("key"), field = $("field"), cta = $("cta");

  input.addEventListener("input", () => {
    const f = formatKey(input.value);
    if (f !== input.value) { input.value = f; }
    field.classList.remove("bad", "good");
  });

  $("clear").addEventListener("click", () => {
    input.value = ""; field.classList.remove("bad", "good"); input.focus();
    $("proxyGuide").classList.add("hidden");
  });

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const key = input.value.trim().toUpperCase();
    
    if (!key.match(/^KEY(-[A-Z0-9]{4}){3}$/)) {
      toast("Sai định dạng key", "err");
      field.classList.add("bad");
      return;
    }

    cta.classList.add("loading"); cta.disabled = true;

    try {
      const res = await fetch(SERVER_URL + "/api/activate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: key, ip: currentIp, device_id: getDeviceId() })
      });
      const data = await res.json();

      if (data.ok) {
        field.classList.add("good");
        toast("Kích hoạt thành công!", "ok");
        showGuide(data.expires_at);
        localStorage.setItem("saved_key", key);
      } else {
        field.classList.add("bad");
        toast(data.message || "Lỗi kích hoạt", "err");
        $("proxyGuide").classList.add("hidden");
      }
    } catch (err) {
      field.classList.add("bad");
      toast("Không kết nối được máy chủ", "err");
      $("proxyGuide").classList.add("hidden");
    } finally {
      cta.classList.remove("loading"); cta.disabled = false;
    }
  });

  // Tự động load lại key cũ nếu có
  const saved = localStorage.getItem("saved_key");
  if (saved) {
    input.value = saved;
    // Tự động kiểm tra trạng thái
    fetch(SERVER_URL + "/api/status", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: saved, device_id: getDeviceId() })
    }).then(r => r.json()).then(d => {
      if (d.state === "active") {
        field.classList.add("good");
        showGuide(d.expires_at);
      }
    }).catch(()=>{});
  }
})();
</script>
</body>
</html>
